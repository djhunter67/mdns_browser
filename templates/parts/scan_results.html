<div id="results">
  <h2>{{ scan_domain }}</h2>
  {% for result in results %}
  <aside class="result">
    <h3>{{ result.name() }}</h3>
    <span><h4>IP:</h4><p>{{ result.address() }}</p></span>
    <span><h4>PORT:</h4><p> {{ result.port() }}</p></span>
    <span><h4>HOSTNAME:</h4><p> {{ result.hostname() }}</p></span>
  </aside>
  {% endfor %}
</div>
